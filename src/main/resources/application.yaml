server:
  port: 8081

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/book_talk?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:booktalk}

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  servlet:
    encoding:
      charset: UTF-8
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:6}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
  aop:
    auto: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 1s
    socket-timeout: 30s

redisson:
  config: classpath:redisson.yml
  address: redis://${spring.redis.host}:${spring.redis.port}
  password: ${spring.redis.password:}
  database: 6
  idleConnectionTimeout: 10000
  connectTimeout: 10000
  timeout: 3000
  retryAttempts: 3
  retryInterval: 1500

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cc.booktalk
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

aliyun:
  oss:
    endpoint: ${ALIYUN_ENDPOINT:}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_BUCKET_NAME:}

logging:
  level:
    root: info
    com.cc.booktalk: debug
    org.springframework: warn
    org.mybatis: warn
    com.baomidou: warn
    org.springframework.amqp: info
    com.rabbitmq: warn

    org.apache.tomcat.websocket: debug
    javax.websocket: debug

app:
  redis:
    redisson:
      netty-threads: ${REDISSON_NETTY_THREADS:2}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:false}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    connect-timeout-millis: 5000
    read-timeout-millis: 30000
    max-session-turns: 12
    session-ttl-hours: 24



